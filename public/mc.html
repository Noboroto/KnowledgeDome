<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC — Olympia Demo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23f5b301'/><text x='50' y='68' font-size='55' font-weight='bold' text-anchor='middle' fill='%230a1128'>O</text></svg>">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/base.css">
<style>
  /* ============================================================
     MC view (spec v2 §11): READ-ONLY, chữ RẤT TO đọc từ xa.
     Nền tối giản phẳng — không hiệu ứng sân khấu gây phân tán.
     Layout gọn 1 viewport 1440×900, ưu tiên: câu hỏi > đáp án > điểm.
     ============================================================ */
  body { background: var(--navy-950); display: flex; flex-direction: column; min-height: 100vh; }

  .top {
    display: flex; align-items: center; gap: var(--sp-4);
    padding: var(--sp-3) var(--sp-5); border-bottom: var(--border-1);
    flex-wrap: wrap;
  }
  .top__round { font-weight: 900; letter-spacing: .08em; color: var(--gold); font-size: var(--fs-lg); }

  .main {
    flex: 1; display: grid; grid-template-columns: 1fr 340px; gap: var(--sp-5);
    padding: var(--sp-5); max-width: 1500px; width: 100%; margin: 0 auto;
    align-content: start;
  }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; } }

  /* Câu hỏi: chữ RẤT to */
  .q-meta { color: var(--text-3); font-weight: 700; letter-spacing: .06em; margin-bottom: var(--sp-3); }
  .q-big {
    font-size: clamp(1.8rem, 3.4vw, 3rem); font-weight: 800; line-height: 1.35;
    min-height: 220px;
  }
  /* Khung đáp án — đánh dấu rõ "chỉ MC/admin thấy" */
  .answer-frame {
    margin-top: var(--sp-5); padding: var(--sp-4) var(--sp-5);
    border: 2px dashed var(--gold-dim); border-radius: var(--r-lg);
    background: rgba(255,201,60,.06);
  }
  .answer-frame__tag {
    display: inline-block; font-size: var(--fs-xs); font-weight: 800;
    letter-spacing: .1em; color: var(--text-on-gold);
    background: var(--grad-gold); border-radius: var(--r-full);
    padding: 2px 12px; margin-bottom: var(--sp-2);
  }
  .answer-frame__text {
    font-size: clamp(1.5rem, 2.6vw, 2.4rem); font-weight: 900; color: var(--gold);
    line-height: 1.3;
  }

  /* Cột phải: tóm tắt điểm + vị trí vòng */
  .side { display: grid; gap: var(--sp-4); align-content: start; }
  .mc-score { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) 0; border-bottom: var(--border-1); }
  .mc-score:last-child { border-bottom: none; }
  .mc-score__rank { width: 26px; font-weight: 900; color: var(--text-3); }
  .mc-score__name { font-weight: 700; font-size: var(--fs-md); line-height: 1.2; }
  .mc-score__pts {
    margin-left: auto; font-size: var(--fs-2xl); font-weight: 900; color: var(--gold);
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .mc-round { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) 0; color: var(--text-3); font-size: var(--fs-sm); }
  .mc-round.is-now { color: var(--text-1); font-weight: 800; }
  .mc-round.is-now::before { content: "▶"; color: var(--gold); }
</style>
</head>
<body>
  <header class="top">
    <a class="nav-back" href="index.html" title="Quay lại (Esc) · Hub (H)">← Hub</a>
    <span class="badge badge--gold">MC VIEW · READ-ONLY</span>
    <span class="top__round" id="roundLabel">KHỞI ĐỘNG</span>
    <div class="grow"></div>
    <span class="text-dim" style="font-size:var(--fs-sm)">phòng <span class="mono text-gold" id="roomCode"></span></span>
  </header>

  <main class="main">
    <!-- Trái: câu hỏi to + đáp án (khung riêng) -->
    <section aria-live="polite">
      <div class="q-meta" id="qMeta">CÂU 1/12</div>
      <div class="q-big" id="qText">—</div>
      <div class="answer-frame">
        <span class="answer-frame__tag">🔒 ĐÁP ÁN — CHỈ MC / ADMIN THẤY</span>
        <div class="answer-frame__text" id="qAnswer">—</div>
      </div>
      <p class="text-dim" style="margin-top:var(--sp-4);font-size:var(--fs-sm)">
        <span class="kbd">←</span> / <span class="kbd">→</span> chuyển câu — màn này chỉ ĐỌC, không điều khiển trận.
      </p>
    </section>

    <!-- Phải: tóm tắt bảng điểm + vị trí vòng trong playlist -->
    <aside class="side">
      <section class="card">
        <h2 class="card__title">Bảng điểm</h2>
        <div id="mcScores"></div>
      </section>
      <section class="card">
        <h2 class="card__title">Vòng hiện tại</h2>
        <div id="mcRounds"></div>
      </section>
    </aside>
  </main>

  <!-- Panel demo: chọn vòng để xem câu tương ứng -->
  <aside class="demo-panel" id="demoPanel">
    <div class="demo-panel__head" id="demoToggle">⚙ Demo vòng thi <span>▾</span></div>
    <div class="demo-panel__body" id="demoRounds"></div>
  </aside>

<script src="assets/mock-data.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  "use strict";
  var M = window.MOCK, UI = window.UI;
  var $ = function (id) { return document.getElementById(id); };
  $("roomCode").textContent = M.roomCode;

  /* ---------- Điểm demo (mock — bản thật sync realtime) ---------- */
  var demoScores = { c1: 155, c2: 120, c3: 85, c4: 100 };
  function renderScores() {
    var w = $("mcScores"); w.innerHTML = "";
    M.contestants.slice()
      .sort(function (a, b) { return demoScores[b.id] - demoScores[a.id]; })
      .forEach(function (c, i) {
        var el = document.createElement("div");
        el.className = "mc-score";
        var rank = document.createElement("span"); rank.className = "mc-score__rank"; rank.textContent = i + 1;
        var av = document.createElement("span");
        av.className = "avatar"; av.style.background = c.color;
        av.textContent = c.name.trim().split(" ").pop()[0];
        var nm = document.createElement("span"); nm.className = "mc-score__name"; nm.textContent = c.name;
        var pts = document.createElement("span"); pts.className = "mc-score__pts"; pts.textContent = demoScores[c.id];
        el.appendChild(rank); el.appendChild(av); el.appendChild(nm); el.appendChild(pts);
        w.appendChild(el);
      });
  }

  /* ---------- Vòng thi từ playlist (không cứng 5 bước) ---------- */
  var activeRound = 0, qIndex = 0;
  function poolForRound() {
    var q = M.questions;
    switch (M.playlist[activeRound].type) {
      case "KHOI_DONG": return q.khoiDongRieng.c1.concat(q.khoiDongChung);
      case "VCNV": return q.vcnv.rows;
      case "TANG_TOC": return q.tangToc;
      case "VE_DICH": return q.veDich[20].concat(q.veDich[30]);
      default: return q.tieBreak;
    }
  }
  function renderRounds() {
    var w = $("mcRounds"); w.innerHTML = "";
    M.playlist.forEach(function (r, i) {
      var el = document.createElement("div");
      el.className = "mc-round" + (i === activeRound ? " is-now" : "");
      el.textContent = " " + (i + 1) + ". " + r.label;
      w.appendChild(el);
    });
    $("roundLabel").textContent = M.playlist[activeRound].label.toUpperCase();
  }
  function renderQuestion() {
    var pool = poolForRound();
    qIndex = Math.max(0, Math.min(qIndex, pool.length - 1));
    var item = pool[qIndex];
    $("qMeta").textContent = "CÂU " + (qIndex + 1) + "/" + pool.length + " · " + M.playlist[activeRound].label.toUpperCase();
    $("qText").textContent = item.text;
    $("qAnswer").textContent = item.answer;
  }

  /* ---------- Panel demo: chọn vòng ---------- */
  M.playlist.forEach(function (r, i) {
    var b = document.createElement("button");
    b.className = "btn btn--sm"; b.textContent = r.label;
    b.addEventListener("click", function () {
      activeRound = i; qIndex = 0;
      renderRounds(); renderQuestion();
    });
    $("demoRounds").appendChild(b);
  });
  $("demoToggle").addEventListener("click", function () {
    $("demoPanel").classList.toggle("is-collapsed");
  });

  /* ---------- Hotkeys: ←/→ chuyển câu ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { qIndex--; renderQuestion(); }
    else if (e.key === "ArrowRight") { qIndex++; renderQuestion(); }
  });

  /* ---------- Deep-link ?round=… ---------- */
  var ROUND_TYPE = { khoidong: "KHOI_DONG", vcnv: "VCNV", tangtoc: "TANG_TOC", vedich: "VE_DICH", cauphu: "TIE_BREAK" };
  var rq = ROUND_TYPE[UI.param("round")];
  if (rq) {
    var ri = M.playlist.findIndex(function (r) { return r.type === rq; });
    if (ri >= 0) activeRound = ri;
  }

  renderScores(); renderRounds(); renderQuestion();
})();
</script>
</body>
</html>
